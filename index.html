<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

  html, body {
    margin: 0; padding: 0;
    min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    color: white;
    text-align: center;
  }

  /* FONDO GALAXIA MORADO + ESTRELLAS */
  body {
    background: linear-gradient(180deg, #0b001a 0%, #2d005c 40%, #6a0dad 100%);
  }
  
  .estrellas { position: fixed; top:0; left:0; width:100%; height:100%; z-index:1; }
  .estrellas span {
    position: absolute; width: 2px; height: 2px;
    background: white; border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 3s infinite;
  }
  .rayita {
    position: absolute; width: 120px; height: 2px;
    background: linear-gradient(90deg, transparent, #ffb3ff, transparent);
    animation: moveRay 10s linear infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.3} 50%{opacity:1} }
  @keyframes moveRay { from {transform: translateX(-200px);} to {transform: translateX(120vw);} }

  .caja { z-index: 2; position: relative; width: 95%; max-width: 750px; padding: 20px; }

  /* ESTE ES EL ESTILO DE LETRA DE TU FOTO */
  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(35px, 8vw, 60px);
    font-weight: 400;
    color: #fff;
    text-shadow: 0 0 10px #ff99ff, 0 0 20px #ff66cc, 0 0 35px #ff66cc;
    margin: 0 0 50px 0;
    white-space: nowrap; /* Para que quede en 1 sola línea */
    display: flex; justify-content: center; align-items: center; gap: 18px;
  }
  
  .emoji { 
    font-size: clamp(40px, 9vw, 55px); 
    filter: drop-shadow(0 0 15px #ff66cc) drop-shadow(0 0 30px #ff99ff);
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow { from {filter: drop-shadow(0 0 10px #ff66cc);} to {filter: drop-shadow(0 0 30px #ff99ff);} }

  button {
    padding: 16px 50px;
    font-size: clamp(18px, 4.5vw, 22px);
    font-weight: bold;
    background: linear-gradient(90deg, #ff8fa3, #ffb3c1);
    color: white; border: none; border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 143, 163, 0.9);
    transition: all 0.3s;
  }
  button:hover { transform: scale(1.08); }

  #pagina2 { display: none; }
</style>
</head>
<body>

<div class="estrellas" id="estrellas"></div>

<div class="caja" id="pagina1">
  <!-- GIRASOL AL INICIO Y ROSA AL FINAL -->
  <h1>
    <span class="emoji">🌻</span>
    Tengo algo que decirte...
    <span class="emoji">🌹</span>
  </h1>
  
  <button onclick="mostrarPagina2()">Continuar</button>
</div>

<div class="caja" id="pagina2">
  <h1>Aquí va tu carta ❤️</h1>
  <p>Escribe tu mensaje aquí...</p>
  <audio id="musica" src="Quiero Caminar Contigo.mp3" loop></audio>
</div>

<script>
  // Generar 120 estrellas
  const contenedor = document.getElementById('estrellas');
  for(let i=0; i<120; i++){
    let star = document.createElement('span');
    star.style.top = Math.random()*100 + '%';
    star.style.left = Math.random()*100 + '%';
    star.style.animationDelay = Math.random()*3 + 's';
    contenedor.appendChild(star);
  }
  // 6 rayitas pasando
  for(let i=0; i<6; i++){
    let ray = document.createElement('div');
    ray.className = 'rayita';
    ray.style.top = Math.random()*100 + '%';
    ray.style.animationDelay = Math.random()*10 + 's';
    contenedor.appendChild(ray);
  }

  function mostrarPagina2() {
    document.getElementById('pagina1').style.display = 'none';
    document.getElementById('pagina2').style.display = 'block';
    document.getElementById('musica').play();
  }
</script>

</body>
</html>
