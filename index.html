<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti</title>
<style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

    * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh; /* Esto arregla lo del celular */
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #0a0a2a 0%, #4b0082 50%, #8a2be2 100%);
    background-attachment: fixed; /* Para que no se corte el degradado */
    overflow-x: hidden;
    font-family: 'Arial', sans-serif;
    color: white;
    text-align: center;
  }

  /* Estrellitas */
  body::before {
    content: "";
    position: fixed; /* fixed en vez de absolute */
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                      radial-gradient(2px 2px at 40px 70px, #fff, transparent);
    background-size: 200px 200px;
    animation: stars 60s linear infinite;
    pointer-events: none;
  }
  @keyframes stars { from {transform: translateY(0);} to {transform: translateY(-1000px);} }

  .caja {
    background: rgba(0,0,0,0.5);
    padding: 30px 25px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    z-index: 2;
    position: relative;
    width: 90%; /* Para que no se salga en cel */
    max-width: 400px;
    margin: 20px;
  }

  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(28px, 8vw, 40px); /* Se adapta al tamaño de pantalla */
    text-shadow: 0 0 10px #ff66cc, 0 0 20px #ff66cc;
    margin-bottom: 15px;
  }
  p { font-size: clamp(14px, 4vw, 18px); margin-bottom: 25px; }

  .emoji { font-size: clamp(30px, 10vw, 45px); filter: drop-shadow(0 0 8px #ff66cc); margin: 0 10px; }

  button {
    padding: 16px 30px;
    font-size: clamp(16px, 4.5vw, 20px);
    background: linear-gradient(90deg, #ff8fa3, #ffb3c1);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 143, 163, 0.8);
    width: 100%;
    font-weight: bold;
  }

  #pagina2 { display: none; }
</style>
   
</style>
</head>
<body>

<!-- MÚSICA -->
<audio id="musica" src="Quiero Caminar Contigo.mp3" loop></audio>

<!-- PÁGINA 1 -->
<div id="pagina1" class="caja">
  <span class="emoji">🌻</span>
  <h1>Tengo algo que decirte...</h1>
  <span class="emoji">🌹</span>
  <p>He estado guardando esto para ti en las estrellas ✨</p>
  <button onclick="mostrar()">Continuar ❤️</button>
</div>

<!-- PÁGINA 2 -->
<div id="pagina2" class="caja">
  <h1>Para ti mi vida ❤️</h1>
  <p>Escribe tu carta aquí</p>
</div>

<script>
function mostrar(){
  document.getElementById("pagina1").style.display="none";
  document.getElementById("pagina2").style.display="block";
  document.getElementById("musica").play(); // Empieza la música al darle click
}
</script>
</body>
</html>
