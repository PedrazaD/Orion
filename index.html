<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti mi vida ❤️</title>
<style>
    body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; color: #fff; padding: 20px;}
    .card { background: rgba(255,255,255,0.2); padding: 35px; border-radius: 25px; backdrop-filter: blur(15px); max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);}
    h1 { font-size: 2.2em; margin-bottom: 15px; } 
    p { font-size: 1.2em; line-height: 1.6; }
    button { background: #ff4d6d; color: white; border: none; padding: 15px 35px; border-radius: 50px; font-size: 1.2em; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.3s;}
    button:hover { background: #ff2e55; transform: scale(1.05); }
</style>
</head>
<body>

<audio id="musica" src="https://drive.google.com/uc?export=download&id=1rbTsunUqBE6wyL4ATbamq44-fm_QalPP" loop></audio>

<div class="card">
    <h1>Hola mi vida ❤️</h1>
    <p>Quería decirte que cada día que pasa te quiero más...<br>
    Y mañana te tengo una sorpresa muy especial.</p>
    <button onclick="document.getElementById('musica').play()">▶️ Toca aquí para la sorpresa</button>
</div>

</body>
</html>
