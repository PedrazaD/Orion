<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #2d1b4e 100%);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Estrellas cayendo */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: fall linear infinite;
    box-shadow: 0 0 6px white;
  }
  
  @keyframes fall {
    0% { transform: translateY(-100px) translateX(0); opacity: 1; }
    100% { transform: translateY(100vh) translateX(50px); opacity: 0; }
  }

  /* Contenedor principal */
  .container {
    text-align: center;
    z-index: 10;
    padding: 30px;
    max-width: 90%;
  }

  h1 {
    font-size: 2.2em;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    animation: glow 2s ease-in-out infinite alternate;
  }
  
  @keyframes glow {
    from { text-shadow: 0 0 20px rgba(255,255,255,0.5); }
    to { text-shadow: 0 0 30px rgba(255,192,203,0.8); }
  }

  p {
    font-size: 1.3em;
    margin-bottom: 40px;
    color: #ffb6c1;
    font-weight: 500;
  }

  /* Botón ROJO criminal */
  .btn {
    background: linear-gradient(135deg, #ff0040 0%, #d4002a 100%);
    color: white;
    border: none;
    padding: 18px 50px;
    font-size: 1.4em;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,0,64,0.6);
    transition: all 0.3s ease;
    animation: pulse 1.5s infinite;
    letter-spacing: 1px;
  }
  
  .btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 40px rgba(255,0,64,0.9);
    background: linear-gradient(135deg, #ff1a5a 0%, #ff0040 100%);
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  
  <div class="container">
    <h1>🌻 Sabía que ibas a darle click 🌹</h1>
    <p>Ahora que ya caíste... ¿continúas?</p>
    <button class="btn" onclick="continuar()">CONTINUAR</button>
  </div>

<script>
  // Crear estrellas cayendo
  function createStars() {
    const starsContainer = document.getElementById('stars');
    for(let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.animationDelay = Math.random() * 5 + 's';
      starsContainer.appendChild(star);
    }
  }
  createStars();

  function continuar() {
    alert("Aquí va tu siguiente mensaje secreto 😉");
    // Aquí puedes redirigir: window.location.href = "pagina2.html";
  }
</script>
</body>
</html>
