<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para ti ❤️</title>
  <style>
    body {text-align:center; background:#ffe6f0; padding-top:100px; font-family:Arial;}
    button {padding:20px 40px; font-size:20px; background:#ff4d94; color:white; border:none; border-radius:15px; cursor:pointer;}
  </style>
</head>
<body>
  <h1>Hola mi vida ❤️</h1>
  <p>Te hice esta sorpresita...</p>
  <button onclick="playMusic()">Toca aquí para la sorpresa</button>

  <audio id="musica" src="Quiero Caminar Contigo.mp3" loop></audio>

  <script>
    function playMusic() {
      document.getElementById("musica").play();
    }
  </script>
</body>
</html>
