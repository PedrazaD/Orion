<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #0a0a2a 0%, #4b0082 50%, #8a2be2 100%);
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    color: white;
    text-align: center;
  }

  /* Estrellitas cayendo */
  body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                      radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                      radial-gradient(1px 1px at 50px 160px, #ddd, rgba(0,0,0,0));
    background-size: 200px 200px;
    animation: stars 60s linear infinite;
  }
  @keyframes stars { from {transform: translateY(0);} to {transform: translateY(-1000px);} }

  .caja {
    background: rgba(0,0,0,0.4);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    z-index: 2;
    position: relative;
    max-width: 400px;
  }

  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 40px;
    text-shadow: 0 0 10px #ff66cc, 0 0 20px #ff66cc;
    margin-bottom: 15px;
  }
  p { font-size: 18px; margin-bottom: 25px; }

  .emoji { font-size: 45px; filter: drop-shadow(0 0 8px #ff66cc); margin: 0 10px; }

  button {
    padding: 18px 35px;
    font-size: 20px;
    background: linear-gradient(90deg, #ff8fa3, #ffb3c1);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 143, 163, 0.8);
    transition: 0.3s;
    font-weight: bold;
  }
  button:hover { transform: scale(1.1); }

  #pagina2 { display: none; }
</style>
</head>
<body>

<!-- MÚSICA -->
<audio id="musica" src="Quiero Caminar Contigo.mp3" loop></audio>

<!-- PÁGINA 1 -->
<div id="pagina1" class="caja">
  <span class="emoji">🌻</span>
  <h1>Tengo algo que decirte...</h1>
  <span class="emoji">🌹</span>
  <p>He estado guardando esto para ti en las estrellas ✨</p>
  <button onclick="mostrar()">Continuar ❤️</button>
</div>

<!-- PÁGINA 2 -->
<div id="pagina2" class="caja">
  <h1>Para ti mi vida ❤️</h1>
  <p>Escribe tu carta aquí</p>
</div>

<script>
function mostrar(){
  document.getElementById("pagina1").style.display="none";
  document.getElementById("pagina2").style.display="block";
  document.getElementById("musica").play(); // Empieza la música al darle click
}
</script>
</body>
</html>
