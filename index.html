<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienes una carta</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    color: white;
    font-family: 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Estrellas cayendo elegante */
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffd700;
    border-radius: 50%;
    animation: fall linear infinite;
    box-shadow: 0 0 10px #ffd700;
  }
  
  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  /* Sobre/carta */
  .container {
    text-align: center;
    z-index: 10;
    padding: 40px;
    max-width: 90%;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
  }

  .icono {
    font-size: 4em;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: 1.9em;
    margin-bottom: 15px;
    font-weight: 400;
    letter-spacing: 1px;
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
  }

  p {
    font-size: 1.2em;
    margin-bottom: 35px;
    color: #e8e8e8;
    font-style: italic;
    opacity: 0.9;
  }

  /* Botón rojo elegante */
  .btn {
    background: linear-gradient(135deg, #c62828 0%, #8e0000 100%);
    color: white;
    border: 2px solid rgba(255, 215, 0, 0.4);
    padding: 16px 45px;
    font-size: 1.2em;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(198, 40, 40, 0.5);
    transition: all 0.4s ease;
    letter-spacing: 2px;
    font-family: 'Georgia', serif;
  }
  
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 35px rgba(198, 40, 40, 0.8);
    border-color: #ffd700;
    background: linear-gradient(135deg, #d32f2f 0%, #c62828 100%);
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  
  <div class="container">
    <div class="icono">💌</div>
    <h1>Tienes una carta digital</h1>
    <p><strong>Karen Rojas</strong></p>
    <p>¿Quieres saber su contenido?</p>
    <button class="btn" onclick="continuar()">ABRIR CARTA</button>
  </div>

<script>
  // Crear estrellas doradas cayendo
  function createStars() {
    const starsContainer = document.getElementById('stars');
    for(let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 4 + 3) + 's';
      star.style.animationDelay = Math.random() * 6 + 's';
      starsContainer.appendChild(star);
    }
  }
  createStars();

  function continuar() {
    alert("Aquí va el contenido de tu carta 😉");
    // window.location.href = "carta.html";
  }
</script>
</body>
</html>
